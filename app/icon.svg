<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top Use AI">
  <!--
    The mark is the site's scorecard reduced to two shapes: an open gauge ring
    and the aperture at its centre. It carries the same idea as the post covers
    (a dial with one lime arc) and the header logo (a circle punched out of a
    graphite tile), so the favicon, the nav mark and the cover art all read as
    one brand.

    Deliberately only two shapes, both heavy. At 16px a thin arc or a third
    element silts up into a smudge. The gap in the ring sits at the lower right,
    which keeps the silhouette asymmetric and so still recognisable at tab size,
    where a plain centred circle would look like every other favicon.
  -->
  <rect width="512" height="512" rx="128" fill="#22202E"/>

  <!-- Open gauge ring: 270°, from 6 o'clock round to 3 o'clock. -->
  <path
    d="M256 406 A150 150 0 1 1 406 256"
    fill="none"
    stroke="#D6FF3F"
    stroke-width="56"
    stroke-linecap="round"/>

  <!-- The aperture. -->
  <circle cx="256" cy="256" r="62" fill="#D6FF3F"/>
</svg>

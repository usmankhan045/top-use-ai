name: Publish scheduled posts

# Admin-scheduled posts use status='scheduled' with a future publish_at. Older
# queued posts use status='draft' with a future published_at. This flips both
# formats to published once their date arrives.
#
# The publisher is idempotent - the queued status is itself the guard, so a
# post already published can never be picked up twice. A run that finds nothing
# due is a no-op, and a re-run after a failure is safe.
#
# Existing review posts are scheduled for 13:00 UTC, while the Tool Finder
# series is scheduled for 16:00 UTC. Runs at 13:15 and 16:15 publish each lane
# after its due time. A cron must stay strictly later than the post time.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   REVALIDATION_SECRET   (required - publishing must refresh the prerendered
#                          article path and affected listings)

on:
  schedule:
    # Keep separate publication lanes for existing reviews and the Tool Finder
    # series. Fifteen minutes of slack prevents a run from racing its post.
    - cron: "15 13 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would publish without changing anything"
        type: boolean
        default: false

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail before changing Supabase. With a finite prerendered route catalog,
      # publishing without revalidation could leave the database row published
      # while its existing static 404 remains live.
      - name: Validate publishing configuration
        env:
          SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "REVALIDATION_SECRET is required; refusing to publish."
            exit 1
          fi

      - name: Publish due posts
        id: publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: node scripts/publishing/publish-due.js

      # A post that just went live can unblock forward links that were removed
      # while it was still a draft (see docs/PENDING-INTERNAL-LINKS.md), and a
      # newly published post can itself link to something still scheduled. Run
      # after publishing so either case surfaces here rather than in an audit.
      # Reports only - a broken link should not fail an otherwise good publish.
      - name: Check internal links
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publishing/check-internal-links.js

      # Post pages and listings are cached. Refresh the newly published post
      # plus the affected listing surfaces; this preserves instant publishing
      # without making every article request execute a server function.
      - name: Revalidate affected pages
        if: steps.publish.outputs.published && steps.publish.outputs.published != '0'
        env:
          SECRET: ${{ secrets.REVALIDATION_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.topuseai.com' }}
          CATEGORIES: ${{ steps.publish.outputs.categories }}
        # Explicit: the path-building below uses bash arrays.
        shell: bash
        run: |
          # The static listings that index newly published posts.
          paths='"/","/blog","/sitemap.xml"'
          IFS=',' read -ra slug_list <<< "${{ steps.publish.outputs.slugs }}"
          for slug in "${slug_list[@]}"; do
            [ -n "$slug" ] && paths="$paths,\"/blog/$slug\""
          done
          IFS=',' read -ra cat_list <<< "$CATEGORIES"
          for cat in "${cat_list[@]}"; do
            [ -n "$cat" ] && paths="$paths,\"/category/$cat\""
          done

          echo "Revalidating: $paths"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -X POST "$SITE/api/revalidate" \
            -H 'Content-Type: application/json' \
            -d "{\"secret\":\"$SECRET\",\"paths\":[$paths]}"
          echo "  Revalidated."

      # Tell Bing, Yandex and Naver directly rather than waiting for a recrawl.
      # Google does not use IndexNow, so this does nothing for Google Search,
      # but Bing's index feeds ChatGPT and Copilot. Never fail the publish over
      # it: the post is already live either way.
      - name: Submit new URLs to IndexNow
        if: steps.publish.outputs.published && steps.publish.outputs.published != '0'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.topuseai.com' }}
          SLUGS: ${{ steps.publish.outputs.slugs }}
        shell: bash
        run: |
          IFS=',' read -ra slug_list <<< "$SLUGS"
          node scripts/publishing/indexnow.js "${slug_list[@]}"

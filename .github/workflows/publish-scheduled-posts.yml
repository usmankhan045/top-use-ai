name: Publish scheduled posts

# Posts are stored as drafts with a future published_at. This flips them to
# published once that date arrives. Site queries filter on status only, so a
# draft stays invisible until this runs.
#
# The publisher is idempotent — status='draft' is itself the guard, so a post
# already published can never be picked up twice. A run that finds nothing due
# is a no-op, and a re-run after a failure is safe.
#
# Every queued post is scheduled for 13:00 UTC, so this runs once daily at
# 13:15. The earlier 13:00 cron raced the posts it was meant to publish and
# lost. If post times ever change, move this cron to match — it must stay
# strictly LATER than the post time, never equal to it.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   REVALIDATION_SECRET   (optional — without it, pages lag until ISR expires)

on:
  schedule:
    # Posts are all scheduled for 13:00 UTC. This fires at 13:15 — 15 minutes
    # of slack absorbs GitHub's scheduling delay, so the post is always due by
    # the time the run starts. One run a day, not 96.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would publish without changing anything"
        type: boolean
        default: false

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish due posts
        id: publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: node scripts/publishing/publish-due.js

      # Next.js caches pages, so a DB change alone stays invisible until the
      # page regenerates. On-demand revalidation touches only the handful of
      # paths a new post affects — a deploy hook would rebuild all ~675 pages
      # and burn ISR quota for no gain.
      - name: Revalidate affected pages
        if: steps.publish.outputs.published && steps.publish.outputs.published != '0'
        env:
          SECRET: ${{ secrets.REVALIDATION_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.topuseai.com' }}
          SLUGS: ${{ steps.publish.outputs.slugs }}
          CATEGORIES: ${{ steps.publish.outputs.categories }}
        # Explicit: the path-building below uses bash arrays.
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "No REVALIDATION_SECRET set; skipping revalidation."
            echo "Posts are published in the DB but pages may lag by up to an"
            echo "hour until ISR expires. Add the secret in Settings > Secrets."
            exit 0
          fi

          # The post pages themselves, plus the listings that index them.
          paths='"/","/blog"'
          # read -a splits on IFS reliably; a bare `for x in $VAR` does not.
          IFS=',' read -ra slug_list <<< "$SLUGS"
          for slug in "${slug_list[@]}"; do
            [ -n "$slug" ] && paths="$paths,\"/blog/$slug\""
          done
          IFS=',' read -ra cat_list <<< "$CATEGORIES"
          for cat in "${cat_list[@]}"; do
            [ -n "$cat" ] && paths="$paths,\"/category/$cat\""
          done

          echo "Revalidating: $paths"
          curl -fsS -X POST "$SITE/api/revalidate" \
            -H 'Content-Type: application/json' \
            -d "{\"secret\":\"$SECRET\",\"paths\":[$paths]}"
          echo "  Revalidated."
